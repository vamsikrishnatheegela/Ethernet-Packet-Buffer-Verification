name: RTL Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install simulation and lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: Run directed and multi-seed regressions
        run: |
          chmod +x scripts/run_tests.sh
          ./scripts/run_tests.sh

      - name: Lint packet buffer
        run: verilator --lint-only --Wall -Wno-fatal --top-module packet_buffer rtl/packet_buffer.sv

      - name: Lint descriptor manager
        run: verilator --lint-only --Wall -Wno-fatal --top-module descriptor_manager rtl/descriptor_manager.sv

      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-verification-logs
          path: results/*.log
          if-no-files-found: warn
